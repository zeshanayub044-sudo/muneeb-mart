services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set private .env values}
      MARIADB_USER: ${MARIADB_USER:?Set private .env values}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set private .env values}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set private .env values}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 20
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:8088:80
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'development'); define('DISALLOW_FILE_EDIT', true);"
    volumes:
      - wordpress:/var/www/html
      - ./wordpress/wp-content/themes/muneeb-mart:/var/www/html/wp-content/themes/muneeb-mart
      - ./wordpress/wp-content/plugins/muneeb-mart-core:/var/www/html/wp-content/plugins/muneeb-mart-core
volumes:
  database:
  wordpress:
