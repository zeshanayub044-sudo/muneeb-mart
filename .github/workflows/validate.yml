name: Validate and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find wordpress/wp-content/themes/muneeb-mart wordpress/wp-content/plugins/muneeb-mart-core scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check wordpress/wp-content/themes/muneeb-mart/assets/js/store.js
      - name: Package installable archives
        run: |
          mkdir -p releases
          cd wordpress/wp-content/themes && zip -qr ../../../releases/muneeb-mart-theme.zip muneeb-mart
          cd ../plugins && zip -qr ../../../releases/muneeb-mart-core.zip muneeb-mart-core
      - uses: actions/upload-artifact@v4
        with:
          name: muneeb-mart-installers
          path: releases/*.zip
